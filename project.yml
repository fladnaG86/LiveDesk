name: LiveDesk
options:
  bundleIdPrefix: dev.livedesk
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LiveDeskKit:
    type: framework
    platform: macOS
    sources:
      - Sources/LiveDeskKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.livedesk.kit
        GENERATE_INFOPLIST_FILE: YES
  LiveDesk:
    type: application
    platform: macOS
    sources:
      - Sources/LiveDesk
      - path: Resources/Scenes
        type: folder
        buildPhase: resources
    dependencies:
      - target: LiveDeskKit
    info:
      path: Sources/LiveDesk/Info.plist
      properties:
        CFBundleDisplayName: LiveDesk
        CFBundleShortVersionString: "0.2.1"
        CFBundleVersion: "3"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSAudioCaptureUsageDescription: "LiveDesk ascolta l'audio del Mac solo per far reagire le scene animate alla musica. Niente viene registrato o inviato."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.livedesk.app
  livedesk-render:
    type: tool
    platform: macOS
    sources:
      - Sources/LiveDeskRender
    dependencies:
      - target: LiveDeskKit
    settings:
      base:
        PRODUCT_NAME: livedesk-render
        LD_RUNPATH_SEARCH_PATHS: "@executable_path @executable_path/../Frameworks"
  LiveDeskKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LiveDeskKitTests
    dependencies:
      - target: LiveDeskKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.livedesk.kit.tests
schemes:
  LiveDesk:
    build:
      targets:
        LiveDesk: all
        livedesk-render: all
        LiveDeskKitTests: [test]
    test:
      targets:
        - LiveDeskKitTests
